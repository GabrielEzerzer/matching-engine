[package]
name = "matching-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]

[features]
# Exposes the book's parts as `matching_engine::internals` for the microbenchmarks
# (`examples/micro.rs`). Default builds and the public API are unchanged.
internals = []

[[example]]
name = "micro"
required-features = ["internals"]

[dev-dependencies]
proptest = "1"
sha2 = "0.10"
hdrhistogram = { version = "7", default-features = false }

# Release builds are what the replay, the golden check and the benchmark run. One codegen unit
# and fat LTO give the optimiser the whole program; debug info adds nothing at run time and lets
# `perf` attribute samples to source lines.
[profile.release]
codegen-units = 1
lto = "fat"
debug = true
