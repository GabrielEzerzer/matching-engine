# Runs on pushes to branches other than main and on manual dispatch, so each push starts one run
# and a branch has results before its PR exists.
name: ci

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (internals)
        run: cargo clippy --all-targets --features internals -- -D warnings
      # Debug build on purpose: it keeps integer overflow checks on.
      - name: Test
        run: cargo test --all-targets
      # The microbenchmark adapters and their tests need the internals feature.
      - name: Test (internals)
        run: cargo test --all-targets --features internals
