# CI for this repo.
# It runs on pushes to branches other than the default and on manual dispatch, so each push starts one run
# and a branch has results before its PR exists.
name: ci

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Comment-ban lint
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet ast-grep-cli==0.51.1
          PATH="$RUNNER_TEMP/lint/bin:$PATH" python3 setup/lint/ratchet --base "origin/$BASE"
      - name: Lint pack tests
        run: PATH="$RUNNER_TEMP/lint/bin:$PATH" python3 -m unittest discover -s setup/lint/tests
      - name: Script tests
        run: |
          python3 scripts/test_compare_summary.py
          python3 scripts/kaggle_bench.py --self-test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (internals)
        run: cargo clippy --all-targets --features internals -- -D warnings
      # Debug build on purpose: it keeps integer overflow checks on.
      - name: Test
        run: cargo test --all-targets
      # The microbenchmark adapters and their tests need the internals feature.
      - name: Test (internals)
        run: cargo test --all-targets --features internals
